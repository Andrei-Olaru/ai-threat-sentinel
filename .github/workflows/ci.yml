name: CI

# Run on every push and pull request to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: python -m ruff check src/ tests/

      - name: Type check (mypy)
        run: python -m mypy src/sentinel/ || true  # non-blocking for now

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: quality  # only run tests if lint passes

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=sentinel --cov-report=xml
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test  # only build if tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t sentinel:ci .

      - name: Verify image runs
        run: |
          docker run -d --name sentinel-ci -p 8000:8000 \
            -e APP_ENV=development \
            -e DATABASE_URL=postgresql+asyncpg://x:x@localhost/x \
            -e REDIS_URL=redis://localhost:6379/0 \
            sentinel:ci
          # Retry health check (container may need a few seconds to start)
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/api/v1/healthz; then
              echo " ✅ Health check passed"
              exit 0
            fi
            echo "Waiting for container... (attempt $i/10)"
            sleep 2
          done
          echo "❌ Container failed to start"
          docker logs sentinel-ci
          exit 1

